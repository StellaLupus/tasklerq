[package]
name = "tasklerq"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Семейные задачи и покупки: Telegram, Home Assistant и календарь"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "migrate", "macros", "json"] }
subtle = "2.6.1"
teloxide-core = { version = "0.13.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
libc = "0.2"
testcontainers = "0.28.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
