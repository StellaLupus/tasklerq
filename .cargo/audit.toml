[advisories]
# RUSTSEC-2023-0071 (rsa, Marvin attack) присутствует только в Cargo.lock как
# опциональная зависимость sqlx-mysql. MySQL не включён в features и не
# компилируется; Postgres-драйвер rsa не использует.
#
# RUSTSEC-2026-0459 (libsqlite3-sys, CVE в C SQLite) — та же ситуация с
# sqlx-sqlite: Cargo вписывает его в lock из-за слабых features sqlx
# (`sqlx-sqlite?/chrono` и т.п.), но SQLite не включён в features и не
# компилируется (`cargo tree -i libsqlite3-sys` пуст). Исправление есть только
# в libsqlite3-sys >= 0.39, а sqlx-sqlite (даже 0.9.0) допускает < 0.38.
# Снять, когда sqlx разрешит исправленную версию.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]
