name: tasklerq-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: tasklerq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasklerq
      POSTGRES_PASSWORD: tasklerq
      POSTGRES_DB: tasklerq
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - tasklerq-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklerq -d tasklerq"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  tasklerq:
    build: .
    image: tasklerq:dev
    container_name: tasklerq
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://tasklerq:tasklerq@postgres:5432/tasklerq?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec /usr/local/bin/tasklerq healthcheck --url "http://127.0.0.1:$${BIND_ADDR##*:}/health/ready"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tasklerq-pgdata:
